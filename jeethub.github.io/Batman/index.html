<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08090b">
  <title>Batman | The Man Behind the Mask</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="wallpaper" aria-label="Interactive dark vigilante wallpaper">
    <div class="sky"></div>
    <div class="moon" aria-hidden="true"></div>
    <div class="rooftops" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>

    <section class="scene" aria-label="The man behind the mask">
      <div class="man" aria-hidden="true">
        <img class="batman-photo" src="batman-8510022_1280.png" alt="">
        <div class="wayne" src="Bruce wayne.jpg" alt="">
          <div class="wayne-collar"></div>
          <div class="wayne-suit"><span class="tie"></span><span class="lapel left"></span><span class="lapel right"></span></div>
          <div class="wayne-face" aria-hidden="true"></div>
        </div>
      </div>

      <div class="veil" aria-hidden="true">
        <div class="mask-mark">BAT<br><b>MAN</b></div>
        <div class="mask-line one"></div><div class="mask-line two"></div>
      </div>
    </section>

    <header class="hud">
      <p class="kicker">GOTHAM // AFTER DARK</p>
      <h1>THE MAN<br><em>BEHIND</em> THE MASK</h1>
      <p class="hint"><span class="crosshair">+</span>Move your cursor to reveal the truth</p>
    </header>
    <footer class="signature">NIGHT WATCH <span>/</span> 01:17 AM</footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
